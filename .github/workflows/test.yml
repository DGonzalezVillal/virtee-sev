  cross-snp-aarch64:
    name: cross snp aarch64 ${{ matrix.toolchain }} ${{ matrix.features }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: aarch64-unknown-linux-gnu
      - run: cargo check --target aarch64-unknown-linux-gnu --no-default-features --features=${{ matrix.features }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.85.0
          - stable
        features:
          - snp
          - snp,evidence,verifier,endorser,reference,crypto-openssl
          - snp,evidence,verifier,endorser,reference,crypto-rust
